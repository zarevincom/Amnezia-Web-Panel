version: '3.8'

services:
  amnezia_panel:
    image: prvtpro/amnezia-panel:latest
    container_name: amnezia_panel

    ports:
      - "${APP_PORT:-5000}:5000"

    environment:
      PANEL_DB_FILE: /app/data/panel.db
      PANEL_MASTER_KEY: ${PANEL_MASTER_KEY:?Set PANEL_MASTER_KEY in .env before starting the panel}
      PANEL_REQUIRE_ENCRYPTION: "true"

    volumes:
      - amnezia_data:/app/data

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.socket(); s.connect(('localhost', 5000)); s.close()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  amnezia_data:
