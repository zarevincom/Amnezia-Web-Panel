{% extends "base.html" %}{% block content %}<div class="section-title">🎟 Приглашения</div><div class="card"><form onsubmit="createInvite(event)"><div class="form-row"><div class="form-group"><label>Название</label><input id="inviteName" class="form-input" required></div><div class="form-group"><label>Сервер</label><select id="inviteServer" class="form-input">{% for s in servers %}<option value="{{loop.index0}}">{{s.name}}</option>{% endfor %}</select></div></div><div class="form-row"><div class="form-group"><label>Протокол</label><select id="inviteProtocol" class="form-input"><option>awg</option><option>awg2</option><option>xray</option></select></div><div class="form-group"><label>Лимит профилей</label><input id="inviteLimit" class="form-input" type="number" value="1" min="1"></div></div><div class="form-row"><div class="form-group"><label>Ссылка действует до</label><input id="inviteExpires" class="form-input" type="datetime-local" required></div><div class="form-group"><label>Пароль (необязательно)</label><input id="invitePassword" class="form-input" type="password"></div></div><div class="form-row"><div class="form-group"><label>Перевыпусков</label><input id="inviteReissues" class="form-input" type="number" value="1" min="0"></div><div class="form-group"><label>Cooldown, часов</label><input id="inviteCooldown" class="form-input" type="number" value="24" min="1"></div></div><button class="btn btn-primary">Создать приглашение</button></form><div id="newLink" style="margin-top:1rem"></div></div><div class="card" style="margin-top:1rem"><h3>Активные приглашения</h3>{% for i in invites %}<div style="padding:.75rem;border-bottom:1px solid var(--border-color)"><b>{{i.name}}</b> · {{i.claims_count}}/{{i.max_claims}} · {{i.protocol}} · {{'активно' if i.enabled else 'выключено'}} <button class="btn btn-secondary btn-sm" onclick="toggleInvite('{{i.id}}')">Вкл/выкл</button></div>{% else %}<p>Нет приглашений</p>{% endfor %}</div><script>async function createInvite(e){e.preventDefault();let b={name:inviteName.value,server_id:+inviteServer.value,protocol:inviteProtocol.value,max_claims:+inviteLimit.value,expires_at:inviteExpires.value,password:invitePassword.value||null,max_reissues:+inviteReissues.value,reissue_cooldown_hours:+inviteCooldown.value};let r=await fetch('/api/invites',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}),d=await r.json();if(!r.ok)return showToast(d.error||d.detail||'Ошибка','error');newLink.innerHTML='Скопируй ссылку сейчас: <code>'+d.url+'</code>';showToast('Приглашение создано','success');}async function toggleInvite(id){await fetch('/api/invites/'+id+'/toggle',{method:'POST'});location.reload()}</script>{% endblock %}
