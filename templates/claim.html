<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>VPN access</title><link rel="stylesheet" href="/static/css/style.css"></head><body><main style="max-width:560px;margin:4rem auto;padding:0 1rem"><section class="card"><div style="text-align:center"><div class="logo-icon">🔐</div><h1 class="section-title">{{ invite_name }}</h1><p class="form-hint">Получите личный профиль VPN для своего устройства.</p></div><form onsubmit="claim(event)"><div class="form-group"><label class="form-label">Имя устройства</label><input id="device" class="form-input" required maxlength="48" placeholder="iPhone"></div>{% if needs_password %}<div class="form-group"><label class="form-label">Пароль приглашения</label><input id="password" class="form-input" type="password" required></div>{% endif %}<button class="btn btn-primary">Получить профиль</button></form><div id="result" style="margin-top:1rem"></div><div id="profiles" style="margin-top:1.5rem"></div></section></main><script src="/static/js/qrcode.min.js"></script><script>const token='{{token}}';let claimId='';async function claim(e){e.preventDefault();let r=await fetch('/api/claim/'+token,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({device_name:device.value,password:window.password?password.value:null})}),d=await r.json();if(!r.ok){result.textContent=d.error||'Не удалось создать профиль';return}claimId=d.claim_id;show(d);loadProfiles()}function show(d){result.innerHTML='<h3>Профиль готов</h3><div id="qr"></div><textarea class="form-input" rows="7" readonly>'+d.config.replace(/</g,'&lt;')+'</textarea><p style="word-break:break-all"><code>'+d.vpn_link.replace(/</g,'&lt;')+'</code></p><button class="btn btn-secondary" onclick="download()">Скачать .conf</button> '+(d.can_reissue?'<button class="btn btn-danger" onclick="reissue()">Перевыпустить профиль</button>':'');window.cfg=d.config;new QRCode(document.getElementById('qr'),{text:d.config,width:220,height:220})}function download(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([cfg],{type:'text/plain'}));a.download='vpn.conf';a.click()}async function reissue(){if(!confirm('Старый профиль перестанет работать. Продолжить?'))return;let r=await fetch('/api/claim/'+token+'/'+claimId+'/reissue',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({device_name:device.value})}),d=await r.json();if(!r.ok){alert(d.error||'Ошибка');return}show(d);loadProfiles()}function esc(v){let d=document.createElement('div');d.textContent=v;return d.innerHTML}async function loadProfiles(){let r=await fetch('/api/claim/'+token+'/profiles'),d=await r.json();if(!d.profiles?.length)return;profiles.innerHTML='<h3>Мои профили</h3>'+d.profiles.map(p=>'<div class="card" style="margin-top:.75rem;padding:1rem"><b>'+esc(p.name)+'</b><div class="form-hint">'+esc(p.protocol.toUpperCase())+' · '+esc(p.server)+(p.expires_at?' · до '+esc(p.expires_at):'')+'</div><details><summary>Информация о подключении</summary><div style="margin-top:.5rem" id="q-'+p.id+'"></div><textarea class="form-input" rows="5" readonly>'+esc(p.config)+'</textarea><p style="word-break:break-all"><code>'+esc(p.vpn_link)+'</code></p></details></div>').join('');d.profiles.forEach(p=>new QRCode(document.getElementById('q-'+p.id),{text:p.config,width:180,height:180}))}loadProfiles()</script></body></html>
