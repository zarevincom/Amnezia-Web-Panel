<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>VPN access</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <main style="max-width:560px;margin:4rem auto;padding:0 1rem">
    <section class="card">
      <div style="text-align:center">
        <div class="logo-icon">VPN</div>
        <h1 class="section-title">{{ invite_name }}</h1>
        <p class="form-hint">Получите личный профиль VPN для своего устройства.</p>
      </div>
      <form onsubmit="claim(event)">
        <div class="form-group">
          <label class="form-label" for="device">Имя устройства</label>
          <input id="device" class="form-input" required maxlength="48" placeholder="iPhone">
        </div>
        {% if needs_password %}
        <div class="form-group">
          <label class="form-label" for="password">Пароль приглашения</label>
          <input id="password" class="form-input" type="password" required>
        </div>
        {% endif %}
        <button class="btn btn-primary">Получить профиль</button>
      </form>
      <div id="result" style="margin-top:1rem"></div>
      <div id="profiles" style="margin-top:1.5rem"></div>
    </section>
  </main>
  <script src="/static/js/qrcode.min.js"></script>
  <script>
    const token = '{{ token }}';
    let claimId = '';
    let currentProfile = null;
    let claimProfiles = {};

    async function claim(event) {
      event.preventDefault();
      const response = await fetch('/api/claim/' + token, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          device_name: document.getElementById('device').value,
          password: document.getElementById('password')?.value || null
        })
      });
      const data = await response.json();
      if (!response.ok) {
        result.textContent = data.error || 'Не удалось создать профиль';
        return;
      }
      claimId = data.claim_id;
      currentProfile = data;
      show(data);
      loadProfiles();
    }

    function show(profile) {
      result.innerHTML = '<h3>Профиль готов</h3><div id="qr"></div>' +
        '<textarea class="form-input" rows="7" readonly>' + esc(profile.config) + '</textarea>' +
        '<p style="word-break:break-all"><code>' + esc(profile.vpn_link) + '</code></p>' +
        '<button class="btn btn-secondary" type="button" onclick="downloadCurrent()">Скачать .conf</button> ' +
        (profile.can_reissue
          ? '<button class="btn btn-danger" type="button" onclick="reissueProfile(claimId)">Перевыпустить профиль</button>'
          : '');
      new QRCode(document.getElementById('qr'), {text: profile.config, width: 220, height: 220});
    }

    function downloadConfig(profile) {
      const link = document.createElement('a');
      link.href = URL.createObjectURL(new Blob([profile.config], {type: 'text/plain'}));
      link.download = profile.filename || profile.name + '.conf';
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(link.href);
    }

    function downloadCurrent() {
      if (currentProfile) downloadConfig(currentProfile);
    }

    function downloadProfile(id) {
      if (claimProfiles[id]) downloadConfig(claimProfiles[id]);
    }

    async function reissueProfile(id) {
      const profile = claimProfiles[id] || currentProfile;
      if (!profile || !confirm('Старый профиль перестанет работать. Продолжить?')) return;
      const response = await fetch('/api/claim/' + token + '/' + id + '/reissue', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({device_name: profile.name || document.getElementById('device').value})
      });
      const data = await response.json();
      if (!response.ok) {
        alert(data.error || 'Не удалось перевыпустить профиль');
        return;
      }
      claimId = data.claim_id;
      currentProfile = {...profile, ...data};
      show(currentProfile);
      loadProfiles();
    }

    function esc(value) {
      const element = document.createElement('div');
      element.textContent = value || '';
      return element.innerHTML;
    }

    async function loadProfiles() {
      const response = await fetch('/api/claim/' + token + '/profiles');
      const data = await response.json();
      if (!data.profiles?.length) return;
      claimProfiles = Object.fromEntries(data.profiles.map((profile) => [profile.id, profile]));
      profiles.innerHTML = '<h3>Мои профили</h3>' + data.profiles.map((profile) =>
        '<div class="card" style="margin-top:.75rem;padding:1rem">' +
        '<b>' + esc(profile.name) + '</b>' +
        '<div class="form-hint">' + esc(profile.protocol.toUpperCase()) + ' · ' + esc(profile.server) +
        (profile.expires_at ? ' · до ' + esc(profile.expires_at) : '') + '</div>' +
        '<p style="margin:.75rem 0">' +
        '<button class="btn btn-secondary" type="button" onclick="downloadProfile(\'' + profile.id + '\')">Скачать .conf</button> ' +
        (profile.can_reissue
          ? '<button class="btn btn-danger" type="button" onclick="reissueProfile(\'' + profile.id + '\')">Перевыпустить</button>'
          : '') + '</p>' +
        '<details><summary>Информация о подключении</summary>' +
        '<div style="margin-top:.5rem" id="q-' + profile.id + '"></div>' +
        '<textarea class="form-input" rows="5" readonly>' + esc(profile.config) + '</textarea>' +
        '<p style="word-break:break-all"><code>' + esc(profile.vpn_link) + '</code></p>' +
        '</details></div>'
      ).join('');
      data.profiles.forEach((profile) => {
        new QRCode(document.getElementById('q-' + profile.id), {
          text: profile.config,
          width: 180,
          height: 180
        });
      });
    }

    loadProfiles();
  </script>
</body>
</html>
